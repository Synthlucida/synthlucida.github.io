<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FILE MANAGER – SYNTHLUCIDA</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600&family=Exo+2:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* FILE MANAGER pro SYNTHLUCIDA Player (jen PC). Otevírá se z EXPLORE v okně (iframe) nad playerem.
     Sám nic neukládá: všechno čte a mění přes window.parent.SLFM, tedy přes stejná data a funkce jako sekce F
     a MY PLAYLIST - změny se tak hned propíší tam i do hlavního okna a naopak. */
  :root {
    --accent: #00f0ff;
    --bg: #0d0d12; --panel: rgba(255,255,255,0.035); --line: rgba(255,255,255,0.10); --line2: rgba(255,255,255,0.18);
    --txt: #f2f2f5; --muted: rgba(242,242,245,0.58); --danger: #ff8080;
    --sel: color-mix(in srgb, var(--accent) 18%, transparent);
  }
  * { box-sizing: border-box; }
  * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--accent) 45%, #333) rgba(255,255,255,0.05); }
  @supports selector(::-webkit-scrollbar) {
    * { scrollbar-width: auto; scrollbar-color: auto; }
    ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--accent) 40%, #2a2a33); border-radius: 4px; border: 1px solid rgba(255,255,255,0.12); }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
    ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
  }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--txt); overflow: hidden;
    font: 500 13px/1.35 'Exo 2', 'Segoe UI', system-ui, -apple-system, Arial, sans-serif;
    display: flex; flex-direction: column; -webkit-font-smoothing: antialiased;
  }
  button { font: inherit; color: inherit; }
  .orb { font-family: 'Orbitron', 'Segoe UI', sans-serif; letter-spacing: 0.12em; }

  /* ---------- Horní lišta ---------- */
  .top { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); background: linear-gradient(180deg, rgba(255,255,255,0.05), rgba(255,255,255,0.01)); }
  .brand { font-family: 'Orbitron', sans-serif; font-size: 13px; letter-spacing: 0.18em; color: var(--accent); text-shadow: 0 0 10px color-mix(in srgb, var(--accent) 40%, transparent); white-space: nowrap; }
  .top .stat { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .top .sp { flex: 1 1 auto; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border-radius: 9px; cursor: pointer; white-space: nowrap;
    border: 1px solid var(--line2); background: rgba(255,255,255,0.05); font-size: 12px; font-weight: 600; letter-spacing: 0.03em;
    transition: background .15s, border-color .15s, color .15s;
  }
  .btn:hover:not(:disabled), .btn:focus-visible { background: rgba(255,255,255,0.11); border-color: color-mix(in srgb, var(--accent) 55%, transparent); outline: none; }
  .btn:disabled { opacity: 0.38; cursor: default; }
  .btn.primary { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: color-mix(in srgb, var(--accent) 70%, #fff); }
  .btn.danger { color: var(--danger); border-color: rgba(255,128,128,0.45); }
  .btn.sm { padding: 4px 8px; font-size: 11px; border-radius: 8px; }
  .btn.icon { padding: 4px 7px; }
  .close { width: 32px; height: 32px; justify-content: center; padding: 0; border-radius: 50%; font-size: 14px; }

  .notice { flex: none; margin: 8px 14px 0; padding: 7px 11px; border-radius: 9px; font-size: 12px; border: 1px solid rgba(255,200,80,0.4); background: rgba(255,200,80,0.07); }
  .notice[hidden] { display: none; }

  /* ---------- Tři sloupce ---------- */
  .cols { flex: 1 1 auto; min-height: 0; display: grid; grid-template-columns: minmax(200px, 250px) minmax(320px, 1fr) minmax(320px, 0.9fr); gap: 10px; padding: 10px 14px 12px; }
  .col { min-height: 0; min-width: 0; display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
  .col-h { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 9px 10px; border-bottom: 1px solid var(--line); }
  .col-h h2 { margin: 0; font: 600 10px 'Orbitron', sans-serif; letter-spacing: 0.16em; color: var(--muted); }
  .col-b { flex: 1 1 auto; min-height: 0; overflow: auto; }

  /* Zdroje (vlevo) */
  .src-group { padding: 8px 8px 4px; }
  .src-group h3 { margin: 4px 6px 6px; font: 600 9px 'Orbitron', sans-serif; letter-spacing: 0.16em; color: var(--muted); }
  .src {
    display: flex; align-items: center; gap: 7px; width: 100%; padding: 7px 8px; border-radius: 8px; cursor: pointer; text-align: left;
    background: none; border: 1px solid transparent; font-size: 13px;
  }
  .src:hover { background: rgba(255,255,255,0.06); }
  .src.on { background: var(--sel); border-color: color-mix(in srgb, var(--accent) 45%, transparent); }
  .src.drop-ok { outline: 2px dashed var(--accent); outline-offset: -2px; }
  .src .nm { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .src .cnt { flex: none; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .src .act { display: none; gap: 2px; }
  .src:hover .act, .src.on .act { display: inline-flex; }
  .mini { background: none; border: none; padding: 2px 4px; border-radius: 5px; cursor: pointer; opacity: 0.7; font-size: 12px; }
  .mini:hover { opacity: 1; background: rgba(255,255,255,0.12); }
  .newrow { display: flex; gap: 5px; padding: 4px 6px 8px; }
  .inp {
    flex: 1 1 auto; min-width: 0; padding: 6px 9px; border-radius: 8px; border: 1px solid var(--line2); background: rgba(0,0,0,0.3); color: var(--txt); font: inherit; font-size: 12px;
  }
  .inp:focus { outline: none; border-color: var(--accent); }

  /* Seznam (uprostřed i vpravo) */
  .tools { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tools .inp { max-width: 230px; }
  select.inp { flex: 0 0 auto; padding-right: 4px; }
  .bulk { flex: none; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding: 7px 10px; border-top: 1px solid var(--line); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .bulk[hidden] { display: none; }
  .bulk .n { font-size: 12px; font-weight: 600; margin-right: 4px; }
  /* Hromadné úpravy: lišta je vidět pořád (jako v sekci F), tlačítka se zapnou, až je něco vybrané */
  .bulk { flex-direction: column; flex-wrap: nowrap; align-items: stretch; gap: 5px; }
  .bulk .br { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
  .bulk .br .n { margin-left: auto; color: var(--muted); font-weight: 500; }
  .bulk .br .n.on { color: var(--accent); font-weight: 600; }
  .bulk .lbl { font-size: 10px; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; margin-right: 2px; }
  /* malé okno: nápověda pod seznamem pryč a lišta nesmí zabrat celý seznam (posouvá se) */
  @media (max-width: 900px), (max-height: 720px) {
    .hint { display: none; }
    .bulk { flex: 0 1 auto; min-height: 36px; max-height: 42%; overflow-y: auto; padding: 5px 8px; gap: 4px; }
    .bulk .br { flex: none; }
    #mid-body, #tgt-body { min-height: 96px; }
    .bulk .lbl { display: none; }
  }
  ul.rows { list-style: none; margin: 0; padding: 4px; }
  .row {
    display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 7px; cursor: default; user-select: none;
    border: 1px solid transparent; min-height: 32px;
  }
  .row:hover { background: rgba(255,255,255,0.05); }
  .row.sel { background: var(--sel); border-color: color-mix(in srgb, var(--accent) 35%, transparent); }
  .row.playing .rt { color: var(--accent); }
  .row.playing .rt::before { content: '▶ '; font-size: 10px; }
  .row.dragging { opacity: 0.45; }
  .row.drop-before { box-shadow: inset 0 2px 0 var(--accent); }
  .row.drop-after { box-shadow: inset 0 -2px 0 var(--accent); }
  .row input[type=checkbox] { flex: none; accent-color: var(--accent); width: 15px; height: 15px; margin: 0; cursor: pointer; }
  .row .num { flex: none; width: 2.6em; text-align: right; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .row .grip { flex: none; cursor: grab; opacity: 0.45; font-size: 13px; padding: 0 2px; }
  .row .rt { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .meta { flex: none; font-size: 11px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tag { flex: none; font-size: 10px; padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line2); color: var(--muted); white-space: nowrap; max-width: 140px; overflow: hidden; text-overflow: ellipsis; }
  .tag.heart { color: #ff7aa8; border-color: rgba(255,122,168,0.45); }
  .tag.sec { color: color-mix(in srgb, var(--accent) 75%, #fff); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
  .row .ra { flex: none; display: inline-flex; gap: 2px; opacity: 0; }
  .row:hover .ra, .row.sel .ra { opacity: 1; }
  .empty { padding: 24px 16px; text-align: center; color: var(--muted); font-size: 12.5px; line-height: 1.6; }
  .drop-zone-active .col-b { outline: 2px dashed var(--accent); outline-offset: -6px; border-radius: 12px; }

  /* Cíl (vpravo) */
  .tgt-sel { flex: 1 1 auto; min-width: 0; }
  .chips { display: flex; gap: 5px; flex-wrap: wrap; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  .chips[hidden] { display: none; }
  .chip { padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line2); background: none; cursor: pointer; font-size: 11.5px; }
  .chip.on { background: var(--sel); border-color: var(--accent); color: color-mix(in srgb, var(--accent) 70%, #fff); }
  .chip.drop-ok { outline: 2px dashed var(--accent); }
  .hint { flex: none; padding: 6px 12px 8px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }

  /* Rozbalovací nabídka a malé okno */
  .menu { position: fixed; z-index: 50; min-width: 190px; max-width: 300px; max-height: 60vh; overflow: auto; padding: 5px; border-radius: 10px; border: 1px solid var(--line2); background: #17171e; box-shadow: 0 10px 30px rgba(0,0,0,0.6); }
  .menu button { display: block; width: 100%; text-align: left; padding: 6px 9px; border-radius: 7px; background: none; border: none; cursor: pointer; font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .menu button:hover, .menu button:focus-visible { background: var(--sel); outline: none; }
  .menu hr { border: none; border-top: 1px solid var(--line); margin: 4px 2px; }
  .menu .mh { padding: 4px 9px 2px; font: 600 9px 'Orbitron', sans-serif; letter-spacing: 0.14em; color: var(--muted); }
  .dlg-back { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,0.55); display: flex; align-items: center; justify-content: center; }
  .dlg { width: min(380px, calc(100vw - 32px)); padding: 16px; border-radius: 14px; border: 1px solid var(--line2); background: #15151c; display: flex; flex-direction: column; gap: 12px; box-shadow: 0 14px 40px rgba(0,0,0,0.7); }
  .dlg h4 { margin: 0; font: 600 11px 'Orbitron', sans-serif; letter-spacing: 0.14em; color: var(--accent); }
  .dlg .btns { display: flex; justify-content: flex-end; gap: 8px; }
  .toast { position: fixed; left: 50%; bottom: 18px; transform: translate(-50%, 10px); z-index: 70; padding: 8px 14px; border-radius: 999px; background: rgba(20,20,26,0.97); border: 1px solid color-mix(in srgb, var(--accent) 55%, transparent); font-size: 12.5px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; max-width: calc(100% - 40px); text-align: center; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .drag-ghost { position: fixed; top: -100px; left: -100px; padding: 4px 10px; border-radius: 8px; background: #1d1d26; border: 1px solid var(--accent); font-size: 12px; color: #fff; }
  .btn.lang { min-width: 40px; justify-content: center; font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 0.1em; }
  /* Návod */
  .help { width: min(760px, calc(100vw - 48px)); max-height: calc(100vh - 60px); padding: 0; gap: 0; }
  .help .hh { display: flex; align-items: center; gap: 10px; padding: 14px 16px 12px; border-bottom: 1px solid var(--line); }
  .help .hh h4 { flex: 1 1 auto; }
  .help .hb { overflow: auto; padding: 6px 18px 16px; }
  .help h5 { margin: 14px 0 5px; font: 600 10px 'Orbitron', sans-serif; letter-spacing: 0.14em; color: color-mix(in srgb, var(--accent) 75%, #fff); }
  .help p { margin: 0 0 4px; font-size: 13px; line-height: 1.55; color: rgba(242,242,245,0.86); }
  .help ul { margin: 2px 0 4px; padding-left: 18px; font-size: 13px; line-height: 1.55; color: rgba(242,242,245,0.86); }
  .help kbd { display: inline-block; padding: 0 5px; border-radius: 4px; border: 1px solid var(--line2); background: rgba(255,255,255,0.06); font: 600 11px 'Exo 2', sans-serif; }
  /* Užší okno (nainstalovaná appka na PC, zmenšené okno, zvětšení ve Windows) */
  .top { position: relative; }
  @media (max-width: 1050px) { .top .stat { display: none; } }
  @media (max-width: 800px) {
    .top { flex-wrap: wrap; row-gap: 6px; padding-right: 52px !important; }
    .top .sp { display: none; }
    .top .close { position: absolute; right: 10px; top: 8px; }
  }
  @media (max-width: 1180px) {
    .cols { grid-template-columns: minmax(170px, 210px) minmax(240px, 1fr) minmax(240px, 1fr); gap: 8px; padding: 8px 10px 10px; }
    .top { padding: 8px 10px; gap: 6px; }
    .top .btn { padding: 5px 9px; font-size: 11.5px; }
    .tools .inp { max-width: 160px; }
  }
  @media (max-width: 900px) {
    .top .stat { display: none; }
    .cols { grid-template-columns: 1fr 1fr; grid-template-rows: minmax(150px, 36%) 1fr; }
    #col-src { grid-column: 1 / -1; }
    #col-src .col-b { display: flex; flex-wrap: wrap; align-content: flex-start; gap: 0 10px; }
    #col-src .src-group { flex: 1 1 220px; min-width: 0; }
    .row .meta { display: none; }
  }
  @media (max-width: 680px) {
    body { overflow: auto; }
    .cols { display: flex; flex-direction: column; min-height: auto; }
    .col { min-height: 260px; max-height: 70vh; }
    #col-src { max-height: 200px; min-height: 0; }
  }
  .err { padding: 40px; text-align: center; color: var(--muted); line-height: 1.7; }
</style>
</head>
<body>
<div class="top">
  <span class="brand">FILE MANAGER</span>
  <span class="stat" id="stat"></span>
  <span class="sp"></span>
  <input type="file" id="add-input" accept="audio/*" multiple hidden>
  <input type="file" id="restore-input" accept=".json,application/json" hidden>
  <button class="btn primary" id="btn-add"></button>
  <button class="btn" id="btn-backup"></button>
  <button class="btn" id="btn-restore"></button>
  <button class="btn" id="btn-help" aria-haspopup="dialog"></button>
  <button class="btn lang" id="btn-lang"></button>
  <button class="btn close" id="btn-close" aria-label="Close" title="Close (Esc)">✕</button>
</div>
<div class="notice" id="pending" hidden></div>
<div class="cols" id="cols">
  <!-- 1) Zdroje -->
  <section class="col" id="col-src" aria-labelledby="h-src">
    <div class="col-h"><h2 id="h-src"></h2></div>
    <div class="col-b" id="src-list"></div>
  </section>
  <!-- 2) Obsah zdroje -->
  <section class="col" id="col-mid" aria-labelledby="h-mid">
    <div class="col-h">
      <h2 id="h-mid"></h2>
      <span class="sp" style="flex:1"></span>
      <div class="tools">
        <input type="search" class="inp" id="mid-q" autocomplete="off" spellcheck="false">
        <select class="inp" id="mid-sort"></select>
      </div>
    </div>
    <div class="col-b" id="mid-body"></div>
    <div class="bulk" id="mid-bulk" hidden></div>
    <div class="hint" id="mid-hint"></div>
  </section>
  <!-- 3) Cíl: playlist F nebo MY PLAYLIST -->
  <section class="col" id="col-tgt" aria-labelledby="h-tgt">
    <div class="col-h">
      <h2 id="h-tgt"></h2>
      <select class="inp tgt-sel" id="tgt-select"></select>
      <button class="btn sm" id="btn-newpl"></button>
    </div>
    <div class="col-h" id="tgt-head" style="padding-top:7px;padding-bottom:7px"></div>
    <div class="chips" id="tgt-chips" hidden></div>
    <div class="col-b" id="tgt-body"></div>
    <div class="bulk" id="tgt-bulk" hidden></div>
    <div class="hint" id="tgt-hint"></div>
  </section>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var P = null;
  try { P = window.parent && window.parent !== window ? window.parent.SLFM : null; } catch (e) { P = null; }
  var $ = function (id) { return document.getElementById(id); };
  if (!P) {
    document.getElementById('cols').innerHTML = '<div class="err" style="grid-column:1/-1">FILE MANAGER opens from the SYNTHLUCIDA Player (EXPLORE → FILE MANAGER).<br>Otevírá se v SYNTHLUCIDA Playeru (EXPLORE → FILE MANAGER).<br><br><a href="player.html" style="color:inherit">player.html</a></div>';
    return;
  }

  // ---------- Texty ----------
  var TX = {
    en: {
      add: '＋ Add audio files', backup: '💾 Backup lists', restore: '📂 Restore backup', close: 'Close (Esc)',
      sources: 'SOURCES', myFiles: 'MY FILES', allFiles: 'All files', noFolder: 'Without folder', synth: 'SYNTHLUCIDA',
      newFolder: 'New folder', folderPh: 'New folder name', create: 'Create',
      search: 'Search…', sortName: 'Name A–Z', sortNew: 'Newest first', sortSize: 'Largest first', sortOrig: 'Original order',
      target: 'TARGET', myPl: '🎵 MY PLAYLIST', newPl: '＋ Playlist', plName: 'Playlist name', folderName: 'Folder name', secName: 'Section name',
      selected: 'selected', toPl: '＋ To playlist ▾', toQueue: '♥ To My Playlist ▾', toFolder: '📁 To folder ▾', del: '🗑 Delete', play: '▶ Play',
      remove: '✕ Remove', up: '▲', down: '▼', top: '⤒ Top', bottom: '⤓ Bottom', toSec: '📁 Section ▾', copySec: '＋ Also to section ▾',
      rename: '✎ Rename', delPl: '🗑 Delete playlist', playAll: '▶ Play', all: 'ALL', newSec: '＋ Section', renSec: '✎', delSec: '🗑',
      noSection: 'Without section', wholeQueue: 'My Playlist (no section)', newPlMenu: '＋ New playlist…', newFolderMenu: '＋ New folder…', newSecMenu: '＋ New section…',
      fileList: 'Files', inQueue: 'In My Playlist', inPls: 'In playlists: ',
      emptyFiles: 'No files here yet.\nClick „＋ Add audio files“ or drag MP3 / WAV files from your computer right into this window.',
      emptyFolder: 'This folder is empty.\nDrag files onto the folder name on the left to move them here.',
      emptySearch: 'Nothing matches your search.',
      emptyPl: 'This playlist is empty.\nDrag files or SYNTHLUCIDA tracks here from the middle column, or select them and use „＋ To playlist“.',
      emptyQueue: 'My Playlist is empty.\nDrag tracks here, or select them and use „♥ To My Playlist“.',
      emptySec: 'This section is empty.\nDrag tracks here to add them to the section.',
      noPls: 'No playlists yet - create one with „＋ Playlist“.',
      hintMid: 'Click = select · Ctrl/Shift+click = more · double-click = play · drag to a playlist, a folder or My Playlist',
      hintTgt: 'Drag rows to change the order · Delete = remove · double-click = play',
      hintTgtQ: 'Drag rows to change the order · drag onto a section chip = move there · Delete = remove · double-click = play',
      confirmDel: function (n) { return 'Delete ' + n + ' file(s) from this device?\n\nThey will also be removed from your playlists, My Playlist and History. This cannot be undone.'; },
      confirmDelPl: function (nm) { return 'Delete the playlist „' + nm + '“? Your files are kept.'; },
      confirmDelFolder: function (nm, n) { return 'Delete the folder „' + nm + '“?' + (n ? '\n\nThe ' + n + ' file(s) are NOT deleted - they just move to „Without folder“.' : ''); },
      confirmDelSec: function (nm, n) { return 'Delete the section „' + nm + '“?' + (n ? '\n\nThe ' + n + ' track(s) stay in My Playlist.' : ''); },
      added: function (a, s) { return 'Added: ' + a + (s ? ' · already there: ' + s : ''); },
      nothingAdded: 'Already there - nothing was added twice.',
      moved: function (n) { return 'Moved: ' + n; }, removed: function (n) { return 'Removed: ' + n; },
      deleted: function (n, f) { return 'Deleted files: ' + n + (f ? ' · failed: ' + f : ''); },
      stat: function (f, p, q) { return f + ' files · ' + p + ' playlists · My Playlist ' + q; },
      pending: function (n) { return '⏳ From your backup ' + n + ' file(s) are still missing - add them with „＋ Add audio files“ and they sort themselves into their playlists and folders.'; },

      if (moodView) {
        var r1 = el('button', 'chip', '✎'); r1.type = 'button'; r1.title = T.rename;
        r1.addEventListener('click', function () { ask(T.secName, moodView).then(function (v) { if (v === null) return; var r = P.moodRename(moodView, v); if (result(r)) { moodView = r.name; refresh(true); } }); });
        var d1 = el('button', 'chip', '🗑'); d1.type = 'button'; d1.title = T.del;
        d1.addEventListener('click', function () {
          var n = S.queue.filter(function (e) { return e.mood === moodView; }).length;
          if (!confirm(T.confirmDelSec(moodView, n))) return;
          P.moodDelete(moodView); moodView = ''; tgtSel.clear(); refresh(true);
        });
        chips.appendChild(r1); chips.appendChild(d1);
      }
    }
    tgtKeys = items.map(function (x) { return x.key; });
    tgtSel.forEach(function (k) { if (tgtKeys.indexOf(k) < 0) tgtSel.delete(k); });
    var body = $('tgt-body');
    var st = body.scrollTop;
    body.innerHTML = '';
    if (!items.length) {
      var em = el('div', 'empty'); em.style.whiteSpace = 'pre-line';
      em.textContent = isQ ? (moodView ? T.emptySec : T.emptyQueue) : (pl ? T.emptyPl : T.noPls);
      body.appendChild(em);
    } else {
      var ul = el('ul', 'rows');
      ul.setAttribute('role', 'listbox'); ul.setAttribute('aria-multiselectable', 'true');
      var pq = S.playing || {};
      items.forEach(function (x, vi) {
        var playing = pq.playing && (isQ ? (pq.queueActive && pq.queueIndex === x.pos) : (pq.key === 'custom:' + tgt.id && !pq.queueActive && x.entry.src && pq.src === x.entry.src));
        var li = el('li', 'row' + (tgtSel.has(x.key) ? ' sel' : '') + (playing ? ' playing' : ''));
        li.setAttribute('role', 'option'); li.setAttribute('aria-selected', tgtSel.has(x.key) ? 'true' : 'false');
        li.draggable = true;
        li.dataset.key = x.key;
        li.appendChild(el('span', 'grip', '⋮⋮'));
        li.appendChild(el('span', 'num', (vi + 1) + '.'));
        var t = el('span', 'rt', x.name); t.title = x.name; li.appendChild(t);
        if (x.missing) li.appendChild(el('span', 'tag', '?'));
        if (isQ && x.entry.mood && !moodView) li.appendChild(el('span', 'tag sec', '📁 ' + x.entry.mood));
        if (!x.entry.fileId && x.entry.playlist && !String(x.entry.playlist).startsWith('custom:')) li.appendChild(el('span', 'tag', String(x.entry.playlist).toUpperCase()));
        var ra = el('span', 'ra');
        var up = el('button', 'mini', '▲'); up.type = 'button'; up.title = T.up;
        up.addEventListener('click', function (e) { e.stopPropagation(); moveKeys([x.key], -1); });
        var dn = el('button', 'mini', '▼'); dn.type = 'button'; dn.title = T.down;
        dn.addEventListener('click', function (e) { e.stopPropagation(); moveKeys([x.key], 1); });
        var rm = el('button', 'mini', '✕'); rm.type = 'button'; rm.title = T.remove;
        rm.addEventListener('click', function (e) { e.stopPropagation(); removeKeys([x.key]); });
        ra.appendChild(up); ra.appendChild(dn); ra.appendChild(rm);
        li.appendChild(ra);
        li.addEventListener('click', function (e) { selClick(e, x.key, tgtKeys, tgtSel, 'tgt'); updateSel('tgt'); });
        li.addEventListener('dblclick', function () {
          if (isQ) P.queuePlay(x.pos); else P.playPlaylist(tgt.id, x.pos);
          setTimeout(function () { refresh(true); }, 500);
        });
        li.addEventListener('dragstart', function (e) {
          if (!tgtSel.has(x.key)) { tgtSel.clear(); tgtSel.add(x.key); tgtAnchor = x.key; }
          var sel = tgtItems().filter(function (y) { return tgtSel.has(y.key); });
          drag = { from: 'tgt', keys: sel.map(function (y) { return y.key; }), positions: sel.map(function (y) { return y.pos; }) };
          try { e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'x'); } catch (err) { /* ignore */ }
          ghost(e, sel.length === 1 ? x.name : sel.length + ' × ♪');
          setTimeout(function () { document.querySelectorAll('#tgt-body .row.sel').forEach(function (r) { r.classList.add('dragging'); }); }, 0);
        });
        li.addEventListener('dragend', function () { drag = null; clearDropMarks(); document.querySelectorAll('.row.dragging').forEach(function (r) { r.classList.remove('dragging'); }); });
        ul.appendChild(li);
      });
      body.appendChild(ul);
    }
    body.scrollTop = st;
    $('tgt-hint').textContent = isQ ? T.hintTgtQ : T.hintTgt;
    renderTgtBulk();
  }
  function renderTgtBulk() {
    var bar = $('tgt-bulk');
    bar.innerHTML = '';
    bar.hidden = !tgtKeys.length;
    if (!tgtKeys.length) return;
    selRow(bar, tgtKeys, tgtSel, 'tgt');
    var keys = tgtKeys.filter(function (k) { return tgtSel.has(k); });
    var none = !keys.length;
    var r2 = el('div', 'br');
    r2.appendChild(el('span', 'lbl', T.withSel));
    var b1 = btn(T.top, 'sm', function () { moveKeysTo(keys, 0); }); b1.disabled = none;
    var b2 = btn(T.bottom, 'sm', function () { moveKeysTo(keys, Infinity); }); b2.disabled = none;
    r2.appendChild(b1); r2.appendChild(b2);
    if (tgt.kind === 'queue') {
      var bS = btn(T.toSec, 'sm', function () { sectionMenu(bS, keys, false); }); bS.disabled = none;
      r2.appendChild(bS);
      if (S.moods.length) { var bC = btn(T.copySec, 'sm', function () { sectionMenu(bC, keys, true); }); bC.disabled = none; r2.appendChild(bC); }
    }
    var bCp = btn(T.copyTo, 'sm', function () { transferMenu(bCp, keys, false); }); bCp.disabled = none;
    var bMv = btn(T.moveTo, 'sm', function () { transferMenu(bMv, keys, true); }); bMv.disabled = none;
    var bR = btn(T.remove + (none ? '' : ' (' + keys.length + ')'), 'sm danger', function () { removeKeys(keys); }); bR.disabled = none;
    r2.appendChild(bCp); r2.appendChild(bMv); r2.appendChild(bR);
    bar.appendChild(r2);
    var r3 = el('div', 'br');
    r3.appendChild(el('span', 'lbl', T.order));
    var bO = btn(T.sortMenu, 'sm', function () {
      menu(bO, [{ head: T.sortHint },
        { label: T.sortAZ, fn: function () { sortVisible('az'); } }, { label: T.sortZA, fn: function () { sortVisible('za'); } },
        { label: T.sortRev, fn: function () { sortVisible('rev'); } }, { label: T.sortShuffle, fn: function () { sortVisible('mix'); } }]);
    });
    bO.disabled = tgtKeys.length < 2;
    r3.appendChild(bO);
    bar.appendChild(r3);
  }
  // Položka cílového seznamu -> odkaz pro přidání jinam ({k:'f',id} / {k:'t',pl,i}); null = nejde (skladba už v playeru není)
  function refOfEntry(e) {
    if (e.fileId) return fileById(e.fileId) ? { k: 'f', id: e.fileId } : null;
    var pl = String(e.playlist || '');
    var lists = S.catalog[pl] ? [pl] : ['asmr', 'piano', 'chill'];
    for (var j = 0; j < lists.length; j++) {
      var arr = S.catalog[lists[j]] || [];
      for (var i = 0; i < arr.length; i++) if ((e.src && arr[i].src === e.src) || (!e.src && arr[i].title === e.title)) return { k: 't', pl: lists[j], i: arr[i].i };
    }
    return null;
  }
  // Kopírovat / přesunout vybrané do jiného playlistu z F nebo do My Playlist (přesun = přidat tam + odebrat tady)
  function transferMenu(anchor, keys, move) {
    var items = tgtItems().filter(function (x) { return keys.indexOf(x.key) >= 0; });
    var refs = [], pos = [];
    items.forEach(function (x) { var r = refOfEntry(x.entry); if (r) { refs.push(r); pos.push(x.pos); } });
    var from = { kind: tgt.kind, id: tgt.id }; // odkud se přesouvá (cíl se mezitím může změnit, např. na nový playlist)
    var done = function (name, res) {
      if (res && res.error) { toast('⚠ ' + res.error); return; }
      if (move && pos.length) { if (from.kind === 'queue') P.queueRemove(pos); else P.removeFromPlaylist(from.id, pos); keys.forEach(function (k) { tgtSel.delete(k); }); }
      toast(move ? T.movedTo(refs.length, name) : (res && res.added ? T.added(res.added, res.skipped) : T.nothingAdded));
      refresh(true);
    };
    var toPl = function (id, name) { done(name, P.addToPlaylist(id, refs)); };
    var toQ = function (m) { Promise.resolve(P.queueAdd(refs, m || '')).then(function (r) { done(m ? 'My Playlist · ' + m : 'My Playlist', r); }); };
    var es = [];
    if (tgt.kind !== 'queue') {
      es.push({ label: T.myPl, fn: function () { toQ(''); } });
      S.moods.forEach(function (m) { es.push({ label: '\u00a0\u00a0\u00a0📁 ' + m, fn: function () { toQ(m); } }); });
    }
    var others = S.playlists.filter(function (pl) { return !(tgt.kind === 'pl' && pl.id === tgt.id); });
    if (others.length) { if (es.length) es.push('-'); others.forEach(function (pl) { es.push({ label: '▸ ' + pl.name + '  (' + pl.items.length + ')', fn: function () { toPl(pl.id, pl.name); } }); }); }
    if (es.length) es.push('-');
    es.push({ label: T.newPlMenu, fn: function () { newPlaylist(function (id, name) { var r = P.addToPlaylist(id, refs); tgt = { kind: 'pl', id: id }; tgtSel.clear(); done(name || '', r); }); } });
    if (!refs.length) { toast(T.pickNone); return; }
    menu(anchor, es);
  }
  function sortVisible(how) {
    var items = tgtItems().slice();
    if (how === 'az') items.sort(function (a, b) { return cmp(a.name, b.name); });
    else if (how === 'za') items.sort(function (a, b) { return cmp(b.name, a.name); });
    else if (how === 'rev') items.reverse();
    else for (var i = items.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = items[i]; items[i] = items[j]; items[j] = t; }
    applyVisibleOrder(items);
    toast(T.sorted);
  }
  function posOfKeys(keys) { var items = tgtItems(); return items.filter(function (x) { return keys.indexOf(x.key) >= 0; }).map(function (x) { return x.pos; }); }
  function sectionMenu(anchor, keys, copy) {
    var pos = posOfKeys(keys);
    var go = function (m) { var r = P.queueSetMood(pos, m, copy); toast(copy ? T.added(r.changed || 0, 0) : T.moved(r.changed || 0)); refresh(true); };
    var es = [];
    if (!copy) es.push({ label: T.noSection, fn: function () { go(''); } });
    S.moods.forEach(function (m) { es.push({ label: '📁 ' + m, fn: function () { go(m); } }); });
    if (S.moods.length < S.moodMax) { es.push('-'); es.push({ label: T.newSecMenu, fn: function () { newSection(function (m) { go(m); }); } }); }
    menu(anchor, es);
  }
  function removeKeys(keys) {
    var pos = posOfKeys(keys);
    if (!pos.length) return;
    if (tgt.kind === 'queue') P.queueRemove(pos); else P.removeFromPlaylist(tgt.id, pos);
    keys.forEach(function (k) { tgtSel.delete(k); });
    toast(T.removed(pos.length));
    refresh(true);
  }
  // Nové pořadí: viditelné (případně jen jedné sekce) položky se přeskládají, ostatní zůstanou na svých místech
  function applyVisibleOrder(newVisible) {
    var items = tgtItems();
    var total = tgt.kind === 'queue' ? S.queue.length : ((S.playlists.find(function (p) { return p.id === tgt.id; }) || { items: [] }).items.length);
    var slots = items.map(function (x) { return x.pos; }); // místa viditelných položek (vzestupně)
    var order = [];
    for (var i = 0; i < total; i++) order.push(i);
    newVisible.forEach(function (x, k) { order[slots[k]] = x.pos; });
    var ok = tgt.kind === 'queue' ? P.queueReorder(order) : P.reorderPlaylist(tgt.id, order);
    refresh(true);
    return ok;
  }
  function moveKeys(keys, dir) {
    var items = tgtItems();
    var idx = items.map(function (x, i) { return keys.indexOf(x.key) >= 0 ? i : -1; }).filter(function (i) { return i >= 0; });
    if (!idx.length) return;
    var arr = items.slice();
    if (dir < 0) { if (idx[0] === 0) return; idx.forEach(function (i) { var t = arr[i - 1]; arr[i - 1] = arr[i]; arr[i] = t; }); }
    else { if (idx[idx.length - 1] === arr.length - 1) return; idx.slice().reverse().forEach(function (i) { var t = arr[i + 1]; arr[i + 1] = arr[i]; arr[i] = t; }); }
    applyVisibleOrder(arr);
  }
  function moveKeysTo(keys, at) { // at = index ve viditelném seznamu (0 = nahoru, Infinity = dolů)
    var items = tgtItems();
    var moving = items.filter(function (x) { return keys.indexOf(x.key) >= 0; });
    if (!moving.length) return;
    var rest = items.filter(function (x) { return keys.indexOf(x.key) < 0; });
    var cut = Math.max(0, Math.min(rest.length, at));
    applyVisibleOrder(rest.slice(0, cut).concat(moving).concat(rest.slice(cut)));
  }

  // ---------- Přetahování ----------
  var ghostEl = null;
  function ghost(e, text) {
    try {
      if (!ghostEl) { ghostEl = el('div', 'drag-ghost'); document.body.appendChild(ghostEl); }
      ghostEl.textContent = text;
      e.dataTransfer.setDragImage(ghostEl, 10, 10);
    } catch (err) { /* ignore */ }
  }
  function clearDropMarks() { document.querySelectorAll('.drop-before,.drop-after,.drop-ok').forEach(function (n) { n.classList.remove('drop-before', 'drop-after', 'drop-ok'); }); $('col-tgt').classList.remove('drop-zone-active'); }
  function dropIndexIn(container, clientY) { // index ve viditelném seznamu, před který se vkládá
    var rows = Array.prototype.slice.call(container.querySelectorAll('.row'));
    for (var i = 0; i < rows.length; i++) { var r = rows[i].getBoundingClientRect(); if (clientY < r.top + r.height / 2) return i; }
    return rows.length;
  }
  var tgtBody = $('tgt-body');
  tgtBody.addEventListener('dragover', function (e) {
    if (!drag && !(e.dataTransfer && Array.prototype.indexOf.call(e.dataTransfer.types || [], 'Files') >= 0)) return;
    if (!drag) return; // soubory z počítače patří do levého/prostředního sloupce
    e.preventDefault();
    try { e.dataTransfer.dropEffect = drag.from === 'mid' ? 'copy' : 'move'; } catch (err) { /* ignore */ }
    clearDropMarks();
    $('col-tgt').classList.add('drop-zone-active');
    var rows = tgtBody.querySelectorAll('.row');
    var i = dropIndexIn(tgtBody, e.clientY);
    if (rows.length) { if (i < rows.length) rows[i].classList.add('drop-before'); else rows[rows.length - 1].classList.add('drop-after'); }
  });
  tgtBody.addEventListener('dragleave', function (e) { if (!tgtBody.contains(e.relatedTarget)) clearDropMarks(); });
  tgtBody.addEventListener('drop', function (e) {
    if (!drag) return;
    e.preventDefault();
    var d = drag; drag = null;
    var at = dropIndexIn(tgtBody, e.clientY);
    clearDropMarks();
    if (d.from === 'tgt') { moveKeysTo(d.keys, at - tgtItems().slice(0, at).filter(function (x) { return d.keys.indexOf(x.key) >= 0; }).length); return; }
    if (tgt.kind === 'queue') {
      // do zobrazené sekce; pak přesun na místo, kam se pustilo
      var before = S.queue.length;
      addToQueue(d.refs, moodView).then(function () {
        var added = S.queue.length - before;
        if (added > 0) {
          var items = tgtItems();
          var newKeys = items.slice(items.length - added).map(function (x) { return x.key; });
          if (at < items.length - added) moveKeysTo(newKeys, at);
        }
      });
    } else {
      var pl = S.playlists.find(function (x) { return x.id === tgt.id; });
      var items2 = tgtItems();
      var pos = at < items2.length ? items2[at].pos : (pl ? pl.items.length : undefined);
      addToPlaylist(tgt.id, d.refs, pos);
    }
  });
  // soubory přetažené z počítače (Průzkumník) do prostředního nebo levého sloupce = přidat do F
  ['col-mid', 'col-src'].forEach(function (id) {
    var c = $(id);
    c.addEventListener('dragover', function (e) {
      if (drag) return;
      var types = e.dataTransfer ? Array.prototype.slice.call(e.dataTransfer.types || []) : [];
      if (types.indexOf('Files') < 0) return;
      e.preventDefault();
      c.classList.add('drop-zone-active');
    });
    c.addEventListener('dragleave', function (e) { if (!c.contains(e.relatedTarget)) c.classList.remove('drop-zone-active'); });
    c.addEventListener('drop', function (e) {
      c.classList.remove('drop-zone-active');
      if (drag || !e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      e.preventDefault();
      addFiles(e.dataTransfer.files);
    });
  });
  // jinak by prohlížeč přetažený soubor otevřel místo stránky
  window.addEventListener('dragover', function (e) { e.preventDefault(); });
  window.addEventListener('drop', function (e) { e.preventDefault(); });

  // ---------- Horní tlačítka ----------
  function addFiles(list) {
    var files = Array.prototype.slice.call(list || []);
    if (!files.length) return;
    if (S && S.uploadBusy) { toast(T.busy); return; }
    var folderId = src.kind === 'files' && src.id && src.id !== '__none' ? src.id : '';
    var before = new Set(S.files.map(function (f) { return f.id; }));
    Promise.resolve(P.addFiles(files)).then(function () {
      load();
      // přidané soubory rovnou do otevřené složky
      if (folderId && S.folders.some(function (f) { return f.id === folderId; })) {
        var fresh = S.files.filter(function (f) { return !before.has(f.id); }).map(function (f) { return f.id; });
        if (fresh.length) P.moveFiles(fresh, folderId);
      }
      refresh(true);
    }, function () { refresh(true); });
  }
  $('btn-add').addEventListener('click', function () { $('add-input').value = ''; $('add-input').click(); });
  $('add-input').addEventListener('change', function () { var f = Array.prototype.slice.call(this.files || []); this.value = ''; addFiles(f); });
  $('btn-backup').addEventListener('click', function () { P.exportBackup(); });
  $('btn-restore').addEventListener('click', function () { $('restore-input').value = ''; $('restore-input').click(); });
  $('restore-input').addEventListener('change', function () { var f = this.files && this.files[0]; this.value = ''; if (f) Promise.resolve(P.restoreBackup(f)).then(function () { refresh(true); }, function () { refresh(true); }); });
  $('btn-close').addEventListener('click', function () { try { window.parent.closeFileManager(); } catch (e) { /* ignore */ } });
  $('btn-help').addEventListener('click', function () { openHelp(); });
  $('btn-lang').addEventListener('click', function () {
    var want = lang === 'cz' ? 'en' : 'cz';
    try { if (P.setLang) P.setLang(want); } catch (e) { /* ignore */ }
    refresh(true);
  });
  $('btn-newpl').addEventListener('click', function () { newPlaylist(); });
  $('tgt-select').addEventListener('change', function () {
    var v = this.value;
    tgt = v === 'queue' ? { kind: 'queue', id: '' } : { kind: 'pl', id: v.slice(3) };
    tgtSel.clear(); tgtAnchor = null;
    renderTarget();
  });
  $('mid-q').addEventListener('input', function () { midQ = this.value; renderMid(); });
  $('mid-sort').addEventListener('change', function () { midSort = this.value; renderMid(); });

  // ---------- Klávesnice ----------
  var lastPane = 'mid';
  $('col-mid').addEventListener('mousedown', function () { lastPane = 'mid'; });
  $('col-tgt').addEventListener('mousedown', function () { lastPane = 'tgt'; });
  document.addEventListener('mousedown', function (e) { if (!e.target.closest('.menu')) closeMenus(); });
  document.addEventListener('keydown', function (e) {
    var typing = e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.tagName === 'SELECT');
    if (e.key === 'Escape') {
      if (document.querySelector('.help-back')) { e.preventDefault(); closeHelp(); return; }
      if (document.querySelector('.dlg-back')) return;
      if (document.querySelector('.menu')) { closeMenus(); e.preventDefault(); return; }
      if (typing && e.target.value) { return; }
      e.preventDefault();
      try { window.parent.closeFileManager(); } catch (err) { /* ignore */ }
      return;
    }
    if (typing || document.querySelector('.dlg-back')) return;
    if ((e.ctrlKey || e.metaKey) && (e.key === 'a' || e.key === 'A')) {
      e.preventDefault();
      if (lastPane === 'tgt') { tgtKeys.forEach(function (k) { tgtSel.add(k); }); updateSel('tgt'); }
      else { midKeys.forEach(function (k) { midSel.add(k); }); updateSel('mid'); }
      return;
    }
    if (e.key === 'Delete') {
      if (lastPane === 'tgt') { var k = tgtKeys.filter(function (x) { return tgtSel.has(x); }); if (k.length) { e.preventDefault(); removeKeys(k); } }
      else { var refs = midSelectedRefs(); if (refs.length && refs.every(function (r) { return r.k === 'f'; })) { e.preventDefault(); deleteFiles(refs.map(function (r) { return r.id; })); } }
    }
  });

  // ---------- Start ----------
  try { var q = new URLSearchParams(location.search).get('lang'); if (q === 'cz' || q === 'en') { lang = q; T = TX[q]; } } catch (e) { /* ignore */ }
  paintStatic();
  refresh(true);
})();
</script>
</body>
</html>
