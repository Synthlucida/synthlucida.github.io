<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ON AIR – SYNTHLUCIDA</title>
<meta name="description" content="ON AIR – see in real time what Dave (SYNTHLUCIDA) is listening to in RelaxPlayer right now, with a YouTube link to play it yourself.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0b0b10">
<meta name="color-scheme" content="dark">
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* ON AIR (samostatná stránka; v playeru se otevírá v okně přes iframe ?embed=1).
     Jen ČTE z Firebase uzel /onair, který zapisuje přihlášený admin v playeru. Žádný zvuk se nevysílá. */
  :root { --red: #ff3b3b; --red-soft: rgba(255,59,59,0.35); --txt: #f2f2f5; --muted: rgba(242,242,245,0.62); }
  * { box-sizing: border-box; }
  /* Posuvník stejně jako v playeru (Windows jinak ukáže bílý se šipkami): tenký tmavý pruh, kulatý jezdec v barvě ON AIR, bez šipek.
     Chrome/Edge přes ::-webkit-scrollbar, Firefox přes scrollbar-color. */
  * { scrollbar-width: thin; scrollbar-color: #8a2a2e rgba(255,255,255,0.06); }
  @supports selector(::-webkit-scrollbar) {
    * { scrollbar-width: auto; scrollbar-color: auto; }
    ::-webkit-scrollbar { width: 8px; height: 8px; background: transparent; }
    ::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: #8a2a2e; border-radius: 4px; border: 1px solid rgba(255,255,255,0.18); }
    ::-webkit-scrollbar-thumb:hover { background: var(--red); }
    ::-webkit-scrollbar-button { display: none; width: 0; height: 0; }
    ::-webkit-scrollbar-corner { background: transparent; }
  }
  html, body { margin: 0; min-height: 100%; }
  html { background: #0b0b10; }
  html.embed { background: transparent; }
  body {
    font-family: 'Poppins', system-ui, sans-serif; color: var(--txt); background: #0b0b10;
    background-image: radial-gradient(ellipse at 50% -10%, rgba(255,59,59,0.10), transparent 60%), linear-gradient(180deg, #121218 0%, #08080c 100%);
    display: flex; justify-content: center; padding: calc(env(safe-area-inset-top, 0px) + 22px) 16px calc(env(safe-area-inset-bottom, 0px) + 22px);
    -webkit-font-smoothing: antialiased;
  }
  body.embed { padding: 14px 14px 18px; background: transparent; background-image: none; }
  main { width: 100%; max-width: 420px; display: flex; flex-direction: column; align-items: center; gap: 16px; text-align: center; }
  .brand { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 3px; opacity: 0.55; }
  body.embed .brand { display: none; }
  .sign {
    display: inline-flex; align-items: center; gap: 10px; padding: 9px 18px; border-radius: 10px;
    border: 2px solid rgba(255,255,255,0.18); font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 4px;
    color: rgba(255,255,255,0.35); transition: color .4s, border-color .4s, box-shadow .4s;
  }
  .sign .dot { width: 12px; height: 12px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background .4s, box-shadow .4s; }
  body.live .sign { color: var(--red); border-color: var(--red); box-shadow: 0 0 18px var(--red-soft), inset 0 0 12px rgba(255,59,59,0.15); animation: signPulse 2.4s ease-in-out infinite; }
  body.live .sign .dot { background: var(--red); box-shadow: 0 0 10px var(--red); animation: dotBlink 1.2s ease-in-out infinite; }
  @keyframes signPulse { 50% { box-shadow: 0 0 30px rgba(255,59,59,0.55), inset 0 0 16px rgba(255,59,59,0.22); } }
  @keyframes dotBlink { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { body.live .sign, body.live .sign .dot { animation: none; } }
  .status { font-size: 14px; line-height: 1.5; margin: 0; }
  .status strong { color: #fff; font-weight: 600; }
  .card {
    width: 100%; padding: 18px 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.14);
    background: linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); display: flex; flex-direction: column; gap: 10px; align-items: center;
  }
  body.live .card { border-color: rgba(255,59,59,0.45); }
  .label { font-family: 'Orbitron', sans-serif; font-size: 9px; letter-spacing: 2px; color: var(--muted); }
  .title { font-family: 'Orbitron', sans-serif; font-size: 19px; line-height: 1.35; letter-spacing: 0.5px; overflow-wrap: anywhere; margin: 0; }
  .meta { font-size: 12px; color: var(--muted); margin: 0; min-height: 1em; }
  .yt {
    display: inline-flex; align-items: center; gap: 8px; margin-top: 4px; padding: 8px 16px; border-radius: 999px; text-decoration: none;
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.22); color: var(--txt); font-weight: 400; font-size: 13px;
    transition: background .15s, border-color .15s;
  }
  .yt:hover, .yt:focus-visible { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.45); outline: none; }
  .yt svg { width: 17px; height: 17px; fill: #e8424f; flex: none; opacity: 0.9; }
  .yt[hidden], .card[hidden], .meta[hidden], .yt-note[hidden], .from[hidden] { display: none; }
  .from { font-size: 12px; color: var(--muted); }
  .from b { font-family: 'Orbitron', sans-serif; font-size: 11px; letter-spacing: 1.5px; color: #fff; font-weight: 700; padding: 2px 8px; margin-left: 4px; border: 1px solid rgba(255,255,255,0.3); border-radius: 6px; }
  .yt-note { font-size: 11px; color: var(--muted); margin: 0; opacity: 0.85; }
  /* Historie: co tahle stránka zachytila na tomto zařízení (posledních 10) */
  .hist { width: 100%; display: flex; flex-direction: column; gap: 8px; text-align: left; }
  .hist[hidden] { display: none; }
  .hist h2 { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--txt); margin: 0; text-align: center; }
  .hist-note { font-size: 11px; color: var(--muted); margin: 0; text-align: center; opacity: 0.85; }
  .hist ol { list-style: none; margin: 0; padding: 0; border: 1px solid rgba(255,255,255,0.10); border-radius: 12px; overflow: hidden; }
  .hist li { display: flex; align-items: center; gap: 10px; padding: 8px 8px 8px 12px; min-width: 0; }
  .hist li + li { border-top: 1px solid rgba(255,255,255,0.07); }
  .hist .h-time { flex: none; min-width: 3.2em; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hist .h-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .hist .h-title { font-size: 13px; line-height: 1.35; color: var(--txt); overflow-wrap: anywhere; }
  .hist .h-from { font-family: 'Orbitron', sans-serif; font-size: 8.5px; letter-spacing: 1.2px; color: var(--muted); }
  .hist .h-yt { flex: none; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18); background: rgba(255,255,255,0.04); transition: background .15s, border-color .15s; }
  .hist .h-yt:hover, .hist .h-yt:focus-visible { background: rgba(255,255,255,0.10); border-color: rgba(255,255,255,0.45); outline: none; }
  .hist .h-yt svg { width: 16px; height: 16px; fill: #e8424f; opacity: 0.9; }
  .hist-clear { align-self: center; font: inherit; font-size: 11px; color: var(--muted); background: none; border: 1px solid rgba(255,255,255,0.18);
    border-radius: 999px; padding: 5px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .hist-clear:hover, .hist-clear:focus-visible { color: #fff; border-color: rgba(255,255,255,0.45); outline: none; }
  .hist-clear.confirm { color: #fff; border-color: var(--red); }
  .about { font-size: 12.5px; line-height: 1.6; color: var(--muted); margin: 0; text-align: left; }
  .about h2 { font-family: 'Orbitron', sans-serif; font-size: 10px; letter-spacing: 2px; color: var(--txt); margin: 0 0 6px; text-align: center; }
  .back { font-size: 12px; color: var(--muted); text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.25); }
  .back:hover { color: #fff; }
  body.embed .back { display: none; }
</style>
</head>
<body>
<main>
  <div class="brand">SYNTHLUCIDA · RELAXPLAYER</div>
  <div class="sign" aria-hidden="true"><span class="dot"></span>ON AIR</div>
  <p class="status" id="status" role="status" aria-live="polite"></p>
  <section class="card" id="card" hidden>
    <span class="label" id="label"></span>
    <p class="title" id="title"></p>
    <span class="from" id="from" hidden></span>
    <p class="meta" id="meta"></p>
    <a class="yt" id="yt" href="#" target="_blank" rel="noopener noreferrer" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6z"/></svg><span id="yt-text"></span></a>
    <p class="yt-note" id="yt-note" hidden></p>
  </section>
  <section class="hist" id="hist" hidden>
    <h2 id="hist-h"></h2>
    <p class="hist-note" id="hist-note"></p>
    <ol id="hist-list"></ol>
    <button type="button" class="hist-clear" id="hist-clear"></button>
  </section>
  <section class="about">
    <h2 id="about-h"></h2>
    <p id="about-p"></p>
  </section>
  <a class="back" href="player.html" id="back"></a>
</main>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script>
(function () {
  'use strict';
  var params = new URLSearchParams(location.search);
  var embed = params.get('embed') === '1';
  if (embed) {
    document.body.classList.add('embed'); document.documentElement.classList.add('embed');
    // Esc uvnitř okna (po klepnutí do stránky) zavře okno ON AIR v playeru
    document.addEventListener('keydown', function (e) {
      if (e.key !== 'Escape') return;
      try { if (window.parent !== window && typeof window.parent.closeOnAir === 'function') { e.preventDefault(); window.parent.closeOnAir(); } } catch (err) { /* jiný původ */ }
    });
  }
  var lang = params.get('lang');
  if (lang !== 'cz' && lang !== 'en') lang = /^(cs|sk)/i.test(navigator.language || '') ? 'cz' : 'en';
  document.documentElement.lang = lang === 'cz' ? 'cs' : 'en';
  var T = {
    en: {
      live: '<strong>Dave, the author of the SYNTHLUCIDA project, is online right now</strong> and playing live in RelaxPlayer.',
      paused: '<strong>Dave, the author of the SYNTHLUCIDA project, is online</strong> – the music is paused for a moment.',
      offline: 'Dave, the author of the SYNTHLUCIDA project, is not listening right now. Come back later – the ON AIR sign lights up red when he is.',
      connecting: 'Connecting…',
      error: 'Could not connect. Check your internet connection and try again.',
      nowLabel: 'NOW PLAYING', lastLabel: 'LAST PLAYED',
      ownFile: 'From Dave\'s own collection – it may not be on YouTube.',
      since: 'playing since ', ago: 'last played ',
      from: 'from the', fromPost: ' playlist', yt: 'Search on YouTube', ytNote: 'Opens YouTube search results – the track may not be there.',
      aboutH: 'WHAT IS ON AIR?',
      aboutP: 'ON AIR shows in real time what Dave – the author of the SYNTHLUCIDA project – is listening to in RelaxPlayer right now: from ASMR, PIANO, CHILL, his playlists or his own collection. It is not a radio and no sound is streamed – playing the track is up to you. If a track catches your ear, search for it on YouTube with the button and listen along with him. This page updates by itself, so you can leave it open.',
      back: 'Open RelaxPlayer',
      histH: 'RECENTLY PLAYED',
      histNote: 'What this page caught while it was open on this device (last 10).',
      histClear: 'Clear history', histConfirm: 'Really clear? Tap again',
      histYt: 'Search on YouTube: ',
      min: 'min', h: 'h', d: 'd', justNow: 'just now', agoSuffix: ' ago'
    },
    cz: {
      live: '<strong>Dave, autor projektu SYNTHLUCIDA, je právě online</strong> a hraje live v RelaxPlayeru.',
      paused: '<strong>Dave, autor projektu SYNTHLUCIDA, je online</strong> – hudbu má zrovna na chvíli pozastavenou.',
      offline: 'Dave, autor projektu SYNTHLUCIDA, teď neposlouchá. Mrkni sem později – když bude hrát, nápis ON AIR se rozsvítí červeně.',
      connecting: 'Připojuji…',
      error: 'Nepodařilo se připojit. Zkontroluj internet a zkus to znovu.',
      nowLabel: 'PRÁVĚ HRAJE', lastLabel: 'NAPOSLEDY HRÁLO',
      ownFile: 'Z Daveovy vlastní sbírky – na YouTube být nemusí.',
      since: 'hraje od ', ago: 'hrálo ',
      from: 'z playlistu', fromPost: '', yt: 'Hledat na YouTube', ytNote: 'Otevře vyhledávání na YouTube – skladba tam být nemusí.',
      aboutH: 'CO JE ON AIR?',
      aboutP: 'ON AIR ukazuje v reálném čase, co si Dave – autor projektu SYNTHLUCIDA – právě pouští v RelaxPlayeru: z ASMR, PIANO, CHILL, ze svých playlistů nebo z vlastní sbírky. Není to rádio a žádný zvuk se nevysílá – pustit si skladbu je na tobě. Když tě něco zaujme, vyhledej si to tlačítkem na YouTube a poslouchej s ním. Stránka se aktualizuje sama, klidně ji nech otevřenou.',
      back: 'Otevřít RelaxPlayer',
      histH: 'PŘEDTÍM HRÁLO',
      histNote: 'Co tahle stránka zachytila, když byla otevřená na tomto zařízení (posledních 10).',
      histClear: 'Smazat historii', histConfirm: 'Opravdu smazat? Klepni znovu',
      histYt: 'Hledat na YouTube: ',
      min: 'min', h: 'h', d: 'd', justNow: 'právě teď', agoSuffix: ''
    }
  }[lang];

  var $ = function (id) { return document.getElementById(id); };
  $('about-h').textContent = T.aboutH;
  $('about-p').textContent = T.aboutP;
  $('back').textContent = T.back;
  $('yt-text').textContent = T.yt;
  $('yt-note').textContent = T.ytNote;
  $('status').textContent = T.connecting;
  $('hist-h').textContent = T.histH;
  $('hist-note').textContent = T.histNote;
  $('hist-clear').textContent = T.histClear;

  var LIVE_MS = 4 * 60 * 1000;   // bez zprávy od playeru déle než 4 min = už nehraje (zavřený player, výpadek)
  var offset = 0, state = null, lastStatus = '';

  function clean(t) {
    if (typeof t !== 'string') return '';
    var raw = t.replace(/[\u0000-\u001f]+/g, ' ').trim();
    // pojistka i pro starší záznamy: bez "mp3clan.com" a podobných zbytků z názvů souborů
    if (!/mp3clan/i.test(raw)) return raw.slice(0, 300);
    var c = raw.replace(/(?:https?:\/\/)?(?:www\.)?mp3clan(?:\.(?:com|net|org|top))?/gi, ' ')
      .replace(/[\[(\{]\s*[-_.,:|]*\s*[\])\}]/g, ' ').replace(/_+/g, ' ').replace(/\s+/g, ' ')
      .replace(/^[\s\-–—_.,:|]+|[\s\-–—_.,:|]+$/g, '').trim();
    return (c || raw).slice(0, 300);
  }
  function shortTitle(t) { var s = t.replace(/^\s*SYNTHLUCIDA\s*[-–—:]\s*/i, ''); return s || t; }
  function hhmm(ts) { try { return new Date(ts).toLocaleTimeString(lang === 'cz' ? 'cs-CZ' : 'en-GB', { hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; } }
  function ago(ms) {
    var m = Math.round(ms / 60000);
    if (m < 1) return T.justNow;
    var s = m < 60 ? m + ' ' + T.min : (m < 48 * 60 ? Math.round(m / 60) + ' ' + T.h : Math.round(m / 1440) + ' ' + T.d);
    return (lang === 'cz' ? 'před ' : '') + s + T.agoSuffix;
  }
  function now() { return Date.now() + offset; }

  // ---- Historie: jen v tomto zařízení (localStorage), nic se nikam neposílá ----
  var HIST_KEY = 'sl-onair-history', HIST_MAX = 10;
  var YT_SVG = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6z"/></svg>';
  function histLoad() {
    var a = [];
    try { a = JSON.parse(localStorage.getItem(HIST_KEY) || '[]'); } catch (e) { a = []; }
    if (!Array.isArray(a)) return [];
    var out = [];
    a.forEach(function (x) { // jen platné záznamy (poškozená / cizí data se přeskočí)
      if (!x || typeof x !== 'object') return;
      var t = clean(x.t), ts = Number(x.ts);
      if (!t || !isFinite(ts) || ts <= 0) return;
      out.push({ t: t, ts: ts, l: (typeof x.l === 'string' && /^[a-z0-9_-]{1,20}$/.test(x.l)) ? x.l : '', o: x.o === true, sk: (typeof x.sk === 'number' && isFinite(x.sk)) ? x.sk : 0 });
    });
    return out.slice(0, HIST_MAX);
  }
  function histSave(a) { try { localStorage.setItem(HIST_KEY, JSON.stringify(a.slice(0, HIST_MAX))); } catch (e) { /* úložiště zablokované: historie jen do zavření */ } }
  var histMem = histLoad();   // záloha v paměti, kdyby úložiště nešlo
  function histRecord(title, s) {
    var a = histLoad(); if (!a.length && histMem.length) a = histMem.slice(); // znovu načíst: mohla zapsat jiná otevřená stránka
    var sk = (typeof s.since === 'number' && isFinite(s.since)) ? s.since : 0; // "hraje od" z playeru = otisk tohoto přehrání
    if (a.length && a[0].t === title) { // stejná skladba (třeba po pauze) se nezapíše dvakrát
      if (sk && a[0].sk !== sk) { a[0].sk = sk; histMem = a.slice(0, HIST_MAX); histSave(histMem); }
      return false;
    }
    var start = (typeof s.since === 'number' && isFinite(s.since) && s.since > 0 && s.since <= now() + 60000) ? s.since : now();
    var l = (typeof s.list === 'string' && /^[a-z0-9_-]{1,20}$/.test(s.list) && s.own !== true) ? s.list : '';
    var e = { t: title, ts: start, l: l, o: s.own === true, sk: sk };
    // stejná skladba, jen Dave mezitím upravil název (stejné "hraje od") -> přepsat, ne přidat
    if (a.length && sk && a[0].sk === sk) { e.ts = a[0].ts; a[0] = e; } else a.unshift(e);
    histMem = a.slice(0, HIST_MAX);
    histSave(histMem);
    return true;
  }
  function whenText(ts) {
    var d = new Date(ts), n = new Date(now());
    var same = d.getFullYear() === n.getFullYear() && d.getMonth() === n.getMonth() && d.getDate() === n.getDate();
    return same ? hhmm(ts) : (lang === 'cz' ? d.getDate() + '. ' + (d.getMonth() + 1) + '.' : d.getDate() + '/' + (d.getMonth() + 1));
  }
  var lastHistSig = null;
  function histPaint(liveTitle) {
    var a = histLoad(); if (!a.length && histMem.length) a = histMem;
    // skladba z karty nahoře by v historii byla dvakrát
    if (liveTitle && a.length && a[0].t === liveTitle) a = a.slice(1);
    var sig = JSON.stringify(a) + '|' + new Date(now()).toDateString();
    if (sig === lastHistSig) return; // beze změny nepřekreslovat
    lastHistSig = sig;
    var ol = $('hist-list'); ol.textContent = '';
    a.forEach(function (x) {
      var li = document.createElement('li');
      var tm = document.createElement('time'); tm.className = 'h-time'; tm.textContent = whenText(x.ts);
      try { tm.dateTime = new Date(x.ts).toISOString(); } catch (e) { /* ignore */ }
      var main = document.createElement('span'); main.className = 'h-main';
      var tt = document.createElement('span'); tt.className = 'h-title'; tt.textContent = shortTitle(x.t);
      main.appendChild(tt);
      if (x.l) { var f = document.createElement('span'); f.className = 'h-from'; f.textContent = x.l.toUpperCase(); main.appendChild(f); }
      var yt = document.createElement('a'); yt.className = 'h-yt'; yt.target = '_blank'; yt.rel = 'noopener noreferrer';
      yt.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(x.t);
      yt.setAttribute('aria-label', T.histYt + shortTitle(x.t)); yt.title = T.histYt + shortTitle(x.t);
      yt.innerHTML = YT_SVG; // pevná ikona z této stránky, žádný text skladby
      li.appendChild(tm); li.appendChild(main); li.appendChild(yt);
      ol.appendChild(li);
    });
    $('hist').hidden = !a.length;
  }
  var clearTimer = null;
  $('hist-clear').addEventListener('click', function () {
    var b = $('hist-clear');
    if (!b.classList.contains('confirm')) { // dvojí klepnutí, ať se nesmaže omylem
      b.classList.add('confirm'); b.textContent = T.histConfirm;
      clearTimeout(clearTimer);
      clearTimer = setTimeout(function () { b.classList.remove('confirm'); b.textContent = T.histClear; }, 3500);
      return;
    }
    clearTimeout(clearTimer); b.classList.remove('confirm'); b.textContent = T.histClear;
    histMem = [];
    try { localStorage.removeItem(HIST_KEY); } catch (e) { /* ignore */ }
    lastHistSig = null; paint();
  });
  // jiná otevřená stránka ON AIR (okno v playeru / samostatná stránka) historii změnila
  window.addEventListener('storage', function (e) { if (e.key === HIST_KEY || e.key === null) { lastHistSig = null; if (state) paint(); else histPaint(''); } });

  function paint() {
    var s = state || {};
    var title = clean(s.title);
    var ts = typeof s.ts === 'number' ? s.ts : 0;
    var fresh = ts && now() - ts < LIVE_MS;
    var live = !!(fresh && s.playing === true && title);
    var paused = !!(fresh && s.playing === false && title);
    document.body.classList.toggle('live', live);
    if (live) histRecord(title, s);
    histPaint(title); // skladba z karty nahoře (hraje / naposledy hrálo) se v historii neopakuje
    var st = live ? T.live : (paused ? T.paused : T.offline);
    if (st !== lastStatus) { $('status').innerHTML = st; lastStatus = st; } // jen pevné texty z této stránky; beze změny se nepřepisuje (čtečka obrazovky by to hlásila znovu)
    if (!title) { $('card').hidden = true; return; }
    $('card').hidden = false;
    $('label').textContent = live ? T.nowLabel : T.lastLabel;
    $('title').textContent = shortTitle(title);
    var list = (typeof s.list === 'string' && /^[a-z0-9_-]{1,20}$/.test(s.list) && s.own !== true) ? s.list.toUpperCase() : '';
    var from = $('from');
    from.textContent = '';
    if (list) { from.appendChild(document.createTextNode(T.from + ' ')); var b = document.createElement('b'); b.textContent = list; from.appendChild(b); if (T.fromPost) from.appendChild(document.createTextNode(T.fromPost)); }
    from.hidden = !list;
    var meta = [];
    if (live && typeof s.since === 'number') meta.push(T.since + hhmm(s.since));
    if (!live && ts) meta.push(T.ago + ago(now() - ts));
    if (s.own === true) meta.push(T.ownFile);
    $('meta').textContent = meta.join(' · ');
    $('meta').hidden = !meta.length;
    var yt = $('yt');
    yt.href = 'https://www.youtube.com/results?search_query=' + encodeURIComponent(title);
    yt.hidden = false;
    $('yt-note').hidden = false;
    document.title = (live ? '🔴 ' : '') + 'ON AIR – ' + shortTitle(title);
  }

  histPaint('');
  try {
    var cfg = {
      apiKey: "AIzaSyCHuoYFQUVCyF0X34vt6ysdz_FtO5fnNIg",
      authDomain: "synthlucida.firebaseapp.com",
      databaseURL: "https://synthlucida-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "synthlucida",
      storageBucket: "synthlucida.firebasestorage.app",
      messagingSenderId: "244515647380",
      appId: "1:244515647380:web:c7f75f3bea55434f9b6981"
    };
    if (!firebase.apps.length) firebase.initializeApp(cfg);
    var db = firebase.database();
    db.ref('.info/serverTimeOffset').on('value', function (snap) { offset = Number(snap.val()) || 0; if (state) paint(); });
    db.ref('onair').on('value', function (snap) { state = snap.val() || {}; paint(); }, function () { lastStatus = ''; $('status').textContent = T.error; });
    // bez odpovědi (bez internetu) by navždy svítilo "Připojuji…"; data, až dorazí, text zase přepíšou
    setTimeout(function () { if (!state) { lastStatus = ''; $('status').textContent = T.error; } }, 15000);
    setInterval(function () { if (state) paint(); }, 30000); // "hrálo před X min" a zhasnutí po 4 min bez zprávy
  } catch (e) {
    $('status').textContent = T.error;
  }
})();
</script>
