      cloudmoon: '<path d="M17.8 4.2A5 5 0 1 0 14.4 8a3.8 3.8 0 0 1 3.4-3.8Z"/><path d="M9.5 18a4 4 0 0 1-.4-7.98A5 5 0 0 1 19 11.6 3.6 3.6 0 0 1 18.6 18H9.5Z"/>',
      rain: '<path d="M7 15.5a4.3 4.3 0 0 1-.4-8.58A5.3 5.3 0 0 1 16.9 6a3.9 3.9 0 0 1-.4 7.8H7Z"/><path d="M8 18.5 7 21M12 18.5l-1 2.5M16 18.5l-1 2.5"/>',
      snow: '<path d="M7 13.5a4.1 4.1 0 0 1-.4-8.18A5.1 5.1 0 0 1 16.4 4a3.7 3.7 0 0 1-.4 7.4H7Z"/><path d="M8 18v3M6.5 19.5l3-3M9.5 19.5l-3-3M16 18v3M14.5 19.5l3-3M17.5 19.5l-3-3"/>',
      storm: '<path d="M7 13.5a4.1 4.1 0 0 1-.4-8.18A5.1 5.1 0 0 1 16.4 4a3.7 3.7 0 0 1-.4 7.4H7Z"/><path d="M12.5 14 10 18.5h3L11 22"/>',
      fog: '<path d="M4 8h11M3 12h15M4 16h11" />'
    };
    return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">'+icons[name]+'</svg>';
  }

  var ICON_GROUPS = {
    0:  { icon: "sun",      group:"clear" },
    1:  { icon: "cloudsun", group:"clear" },
    2:  { icon: "cloudsun", group:"cloudy" },
    3:  { icon: "cloud",    group:"cloudy" },
    45: { icon: "fog",      group:"fog" },
    48: { icon: "fog",      group:"fog" },
    51: { icon: "rain",     group:"rain" },
    53: { icon: "rain",     group:"rain" },
    55: { icon: "rain",     group:"rain" },
    56: { icon: "rain",     group:"rain" },
    57: { icon: "rain",     group:"rain" },
    61: { icon: "rain",     group:"rain" },
    63: { icon: "rain",     group:"rain" },
    65: { icon: "rain",     group:"rain" },
    66: { icon: "rain",     group:"rain" },
    67: { icon: "rain",     group:"rain" },
    71: { icon: "snow",     group:"snow" },
    73: { icon: "snow",     group:"snow" },
    75: { icon: "snow",     group:"snow" },
    77: { icon: "snow",     group:"snow" },
    80: { icon: "rain",     group:"rain" },
    81: { icon: "rain",     group:"rain" },
    82: { icon: "rain",     group:"rain" },
    85: { icon: "snow",     group:"snow" },
    86: { icon: "snow",     group:"snow" },
    95: { icon: "storm",    group:"storm" },
    96: { icon: "storm",    group:"storm" },
    99: { icon: "storm",    group:"storm" }
  };
  var NIGHT_ICON = { sun:"moon", cloudsun:"cloudmoon" };

  function weatherInfo(code, isDay){
    var day = isDay !== 0;
    var g = ICON_GROUPS[code] || { icon:"cloud", group:"cloudy" };
    var icon = (!day && NIGHT_ICON[g.icon]) ? NIGHT_ICON[g.icon] : g.icon;
    var label = t().weatherLabels[code] || t().weatherLabels.unknown;
    return { label: label, icon: icon, group: g.group };
  }

  // ---- weather-driven accent theme (same visual system as reference: swap CSS custom properties) ----
  var THEME_ACCENTS = {
    clear_day:   ['#ffce54', '#7a5300'],
    clear_night: ['#9b8cfb', '#2c1c66'],
    cloudy:      ['#8fb3d9', '#1d3654'],
    fog:         ['#9fb8bb', '#1f3536'],
    rain:        ['#38bdf8', '#0b3654'],
    snow:        ['#7dd8e8', '#0d4a52'],
    storm:       ['#b18cf9', '#341a5c']
  };
  function applyAccent(group, isDay){
    var key = group === "clear" ? (isDay ? "clear_day" : "clear_night") : group;
    var pair = THEME_ACCENTS[key] || THEME_ACCENTS.clear_day;
    var root = document.documentElement.style;
    root.setProperty("--accent-color", pair[0]);
    root.setProperty("--accent-glow", pair[1]);
  }

  // ---------- geocoding ----------
  var searchTimer = null;
  els.input.addEventListener("input", function(){
    var q = els.input.value.trim();
    clearTimeout(searchTimer);
    if(q.length < 2){ hideSuggestions(); return; }
    searchTimer = setTimeout(function(){ doSearch(q); }, 350);
  });

  document.addEventListener("click", function(e){
    if(!els.suggestions.contains(e.target) && e.target !== els.input) hideSuggestions();
  });

  function hideSuggestions(){ els.suggestions.classList.add("hidden"); els.suggestions.innerHTML = ""; }

  function doSearch(q){
    var primaryLang = t().geocodeLang;
    var fallbackLang = primaryLang === "cs" ? "en" : "cs";
    searchGeocode(q, primaryLang, function(results){
      if(results.length){ renderSuggestions(results); return; }
      searchGeocode(q, fallbackLang, function(fallbackResults){
        renderSuggestions(fallbackResults);
      });
    });
  }

  function searchGeocode(q, lang, cb){
    var url = GEOCODE_URL + "?name=" + encodeURIComponent(q) + "&count=6&language=" + lang + "&format=json";
    fetch(url).then(function(r){ return r.json(); }).then(function(data){
      cb(data.results || []);
    }).catch(function(){ cb([]); });
  }

  function renderSuggestions(results){
    if(!results.length){
      els.suggestions.innerHTML = '<div class="empty">'+t().noCity+'</div>';
      els.suggestions.classList.remove("hidden");
      return;
    }
    els.suggestions.innerHTML = "";
    results.forEach(function(r){
      var btn = document.createElement("button");
      var parts = [r.name];
      if(r.admin1) parts.push(r.admin1);
      if(r.country) parts.push(r.country);
      btn.textContent = parts.join(", ");
      btn.addEventListener("click", function(){
        selectPlace({ name:r.name, admin1:r.admin1, country:r.country, latitude:r.latitude, longitude:r.longitude });
        els.input.value = "";
        hideSuggestions();
      });
      els.suggestions.appendChild(btn);
    });
    els.suggestions.classList.remove("hidden");
  }

  function selectPlace(place){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(place));
    loadWeather(place);
  }

  els.locBtn.addEventListener("click", function(){
    if(!navigator.geolocation){ return; }
    setState(t().locating);
    navigator.geolocation.getCurrentPosition(function(pos){
      var place = { name:t().yourLocation, admin1:"", country:"", latitude:pos.coords.latitude, longitude:pos.coords.longitude };
      selectPlace(place);
    }, function(){
      setState(t().locFail);
    }, { timeout:8000 });
  });

  // ---------- forecast ----------
  function setState(msg){
    els.content.innerHTML = '<div class="state-msg">'+msg+'</div>';
  }

  function loadWeather(place){
    setState(t().loadingSky);
    var params = new URLSearchParams({
      latitude: place.latitude,
      longitude: place.longitude,
      current: "temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,is_day",
      hourly: "temperature_2m,weather_code",
      daily: "sunrise,sunset,weather_code,temperature_2m_max,temperature_2m_min",
      timezone: "auto",
      forecast_days: 6
    });
    fetch(FORECAST_URL + "?" + params.toString())
      .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); })
      .then(function(data){ lastPlace = place; lastData = data; render(place, data); })
      .catch(function(err){ setState(t().forecastFail); console.error(err); });
  }

  function fmtHour(iso){
    var d = new Date(iso);
    return d.toLocaleTimeString(t().dateLocale, { hour:"2-digit", minute:"2-digit" });
  }
  function fmtDay(iso){
    var d = new Date(iso);
    var s = d.toLocaleDateString(t().dateLocale, { weekday:"short" });
    return s.charAt(0).toUpperCase()+s.slice(1).replace(".","");
  }

  function render(place, data){
    var cur = data.current;
    var info = weatherInfo(cur.weather_code, cur.is_day);
    applyAccent(info.group, cur.is_day === 1);

    var placeLabel = place.name;
    if(place.admin1 && place.admin1 !== place.name) placeLabel += ", " + place.admin1;

    // ---- horizon arc math ----
    var todaySunrise = new Date(data.daily.sunrise[0]);
    var todaySunset = new Date(data.daily.sunset[0]);
    var now = new Date();
    var span = todaySunset - todaySunrise;
    var frac = span > 0 ? (now - todaySunrise) / span : 0.5;
    frac = Math.max(0, Math.min(1, frac));
    var x0=20,y0=82,x1=150,y1=12,x2=280,y2=82;
    var t = frac;
    var mx = (1-t)*(1-t)*x0 + 2*(1-t)*t*x1 + t*t*x2;
    var my = (1-t)*(1-t)*y0 + 2*(1-t)*t*y1 + t*t*y2;

    var html = "";
    html += '<div class="card">';
    html += '<div class="place">'+escapeHtml(placeLabel)+'</div>';
    html += '<div class="updated">'+t().updated+fmtHour(cur.time)+'</div>';
    html += '<div class="temp-row">';
    html += '<div class="temp">'+Math.round(cur.temperature_2m)+'<span class="temp-unit">°</span></div>';
    html += '<div class="cond"><div class="cond-icon">'+icon(info.icon)+'</div><div class="cond-label">'+info.label+'</div></div>';
    html += '</div>';
    html += '<div class="feels">'+t().feels+Math.round(cur.apparent_temperature)+'°</div>';

    html += '<div class="arc-wrap"><svg viewBox="0 0 300 94" preserveAspectRatio="none">';
    html += '<path class="arc-path" d="M20,82 Q150,12 280,82"/>';
    html += '<circle class="arc-marker-glow" cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="6" fill="var(--accent-color)"/>';
    html += '<circle class="arc-marker" cx="'+mx.toFixed(1)+'" cy="'+my.toFixed(1)+'" r="6" fill="var(--accent-color)"/>';
    html += '</svg></div>';
    html += '<div class="arc-labels">';
    html += '<span>'+icon(cur.is_day?"sun":"moon")+' '+t().sunrise+fmtHour(data.daily.sunrise[0])+'</span>';
    html += '<span>'+t().sunset+fmtHour(data.daily.sunset[0])+' '+icon("moon")+'</span>';
    html += '</div>';
    html += '</div>'; // card

    html += '<div class="stats">';
    html += statBlock(t().humidity, cur.relative_humidity_2m+"%");
    html += statBlock(t().wind, Math.round(cur.wind_speed_10m)+" km/h");
    html += statBlock(t().precip, (cur.precipitation||0).toFixed(1)+" mm");
    html += '</div>';

    html += '<div class="section-label">'+t().nextHours+'</div>';
    html += '<div class="hourly">';
    var nowIdx = findCurrentHourIndex(data.hourly.time);
    for(var i=nowIdx; i<Math.min(nowIdx+24, data.hourly.time.length); i++){
      var hi = weatherInfo(data.hourly.weather_code[i], isHourDay(data.hourly.time[i], data.daily));
      var isNow = i === nowIdx;
      html += '<div class="hour'+(isNow?" now":"")+'">';
      html += '<div class="hour-time">'+(isNow?t().now:fmtHour(data.hourly.time[i]))+'</div>';
      html += icon(hi.icon);
      html += '<div class="hour-temp">'+Math.round(data.hourly.temperature_2m[i])+'°</div>';
      html += '</div>';
    }
    html += '</div>';

    html += '<div class="section-label">'+t().nextDays+'</div>';
    html += '<div class="days">';
    for(var d=0; d<data.daily.time.length; d++){
      var di = weatherInfo(data.daily.weather_code[d], 1);
      html += '<div class="day">';
      html += '<div class="day-name">'+(d===0?t().today:fmtDay(data.daily.time[d]))+'</div>';
      html += icon(di.icon);
      html += '<div class="day-range"><span class="hi">'+Math.round(data.daily.temperature_2m_max[d])+'°</span><span class="lo">'+Math.round(data.daily.temperature_2m_min[d])+'°</span></div>';
      html += '</div>';
    }
    html += '</div>';

    els.content.innerHTML = html;
  }

  function statBlock(label, value){
    return '<div class="stat"><div class="stat-label">'+label+'</div><div class="stat-value">'+value+'</div></div>';
  }

  function findCurrentHourIndex(times){
    var now = new Date();
    for(var i=0;i<times.length;i++){
      var t = new Date(times[i]);
      if(t >= now) return Math.max(0, i-0);
    }
    return 0;
  }

  function isHourDay(iso, daily){
    var t = new Date(iso).getTime();
    for(var i=0;i<daily.sunrise.length;i++){
      var sr = new Date(daily.sunrise[i]).getTime();
      var ss = new Date(daily.sunset[i]).getTime();
      if(t >= sr && t <= ss) return 1;
    }
    return 0;
  }

  function escapeHtml(s){
    var d = document.createElement("div");
    d.textContent = s;
    return d.innerHTML;
  }

  // ---------- init ----------
  function init(){
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch(e){}
    if(saved && saved.latitude){
      loadWeather(saved);
    } else {
      loadWeather({ name: (LANG==="en"?"Prague":"Praha"), admin1:"", country:(LANG==="en"?"Czechia":"Česko"), latitude:50.0755, longitude:14.4378 });
    }
  }
  init();
})();
</script>
</body>
</html>
